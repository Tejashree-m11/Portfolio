<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Contact</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      background-color: #121212;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
    }

    header h2 {
      color: #9909db;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #9909db;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #1a1a1a;
      padding: 30px;
      border-radius: 15px;
      border: 2px solid #9909db;
      box-shadow: 0 0 20px rgba(153, 9, 219, 0.3);
    }

    .container h1 {
      text-align: center;
      color: #9909db;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
    }

    input, textarea {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      resize: none;
    }

    input:focus, textarea:focus {
      outline: 2px solid #9909db;
    }

    button {
      background-color: #9909db;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #7a07b1;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2>Tejashree's Portfolio</h2>
    <nav>
      <a href="http://127.0.0.1:5500/portfolio.html">Home</a>
      <a href="http://127.0.0.1:5500/about.html">About Me</a>
      <a href="http://127.0.0.1:5500/project.html">Projects</a>
      <a href="http://127.0.0.1:5500/certificate.html">Certificates</a>
      <a href="http://127.0.0.1:5500/contact.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h1>Contact Me</h1>
    <form action="mailto:your-email@example.com" method="POST" enctype="text/plain">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
