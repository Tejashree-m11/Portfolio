<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Home</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #121212;
      padding: 1rem 2rem;
      border-bottom: 1px solid #444;
    }

    header h2 {
      font-size: 24px;
      color:  #9909db;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color:  #9909db;
    }

    .home {
      display: flex;
      justify-content: space-between;
      padding: 50px;
      align-items: center;
      flex-wrap: wrap;
    }

    .home-left {
      flex: 1;
      padding-right: 40px;
    }

    .home-left h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .home-left h1 span {
      color:  #9909db;
    }

    .typewriter {
      font-size: 1.5rem;
      color: #ff4081;
      margin-bottom: 20px;
    }

    .home-left p {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .buttons button {
      padding: 10px 20px;
      margin-right: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      background-color:  #9909db;
      color: #000;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .buttons button:hover {
      background-color:  #9909db;
    }

    .social-icons {
      margin-top: 20px;
    }

    .social-icons img {
      width: 50px;
      height: 50px;
      margin-right: 15px;
      border-radius: 50%;
      border: 2px solid  #9909db;
      padding: 5px;
      background-color: #fff;
    }

    .home-right {
      flex: 1;
      text-align: center;
    }

    .home-right .profile-pic {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 5px solid #9909db;
      object-fit: cover;
    }

    @media screen and (max-width: 768px) {
      .home {
        flex-direction: column;
        text-align: center;
      }

      .home-left, .home-right {
        padding: 20px 0;
      }

      .buttons button {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2>Tejashree's Portfolio</h2>
    <nav>
      <a href="http://127.0.0.1:5500/portfolio.html">Home</a>
      <a href="http://127.0.0.1:5500/about.html">About Me</a>
      <a href="http://127.0.0.1:5500/project.html">Projects</a>
      <a href="http://127.0.0.1:5500/certificate.html">Certificates</a>
      <a href="http://127.0.0.1:5500/contact.html">Contact</a>
    </nav>
  </header>
<br><br><br><br>
  <section class="home">
    <div class="home-left">
      <h1>Hi, I'm <span>Tejashree</span></h1>
      <div class="typewriter">Video Editor & Future Engineer</div>
      <p>I am a student of MIT AOE College, passionate about creating & editing experiences.</p>
      <div class="buttons">
        <button>View My Work</button>
        <button>Contact Me</button>
      </div>
      <div class="social-icons">
        <img src="ic.jpg" alt="LinkedIn">
        <img src="icn.jpg" alt="Twitter">
        <img src="git.jpg" alt="GitHub">
      </div>
    </div>
    <div class="home-right">
      <img src="Tejashree.jpg" alt="teju's Photo" class="profile-pic">
    </div>
  </section>
</body>
</html>
